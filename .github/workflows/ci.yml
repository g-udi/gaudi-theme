name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash --version | head -n 1
          for file in gaudi.theme.bash gaudi.configs.bash lib/*.bash lib/helpers/*.bash segments/*.bash test/run.bash; do
            bash -n "$file"
          done

      - name: Tests
        run: bash test/run.bash

      # macOS ships bash 3.2 as /bin/bash: the theme must still parse and pass
      # its tests there.
      - name: Tests (system bash 3.2)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -n 1
          for file in gaudi.theme.bash gaudi.configs.bash lib/*.bash lib/helpers/*.bash segments/*.bash test/run.bash; do
            /bin/bash -n "$file"
          done
          /bin/bash test/run.bash

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning gaudi.theme.bash gaudi.configs.bash lib/*.bash lib/helpers/*.bash segments/*.bash test/run.bash
